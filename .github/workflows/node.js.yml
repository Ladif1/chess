name: BACKEND CI

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "chess-back/package-lock.json"

      - name: Install dependencies
        working-directory: ./chess-back
        run: |
          npm ci
          npm run generate

      - name: Lint
        working-directory: ./chess-back
        continue-on-error: true # Permet de continuer même si le lint échoue
        run: npm run lint

      - name: Type check
        working-directory: ./chess-back
        run: npm run typecheck

      - name: Build
        working-directory: ./chess-back
        run: npm run build --if-present

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.Username }}
          password: ${{ secrets.Token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./chess-back
          push: true
          tags: ${{ vars.Username }}/chess-back:latest,${{ vars.Username }}/chess-back:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Deploy to Render
        run: |
          curl "${{ secrets.BACK_DEPLOY_HOOK }}"
